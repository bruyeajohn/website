<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Anniversary!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💕</text></svg>">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: #f9f7f7;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .hero-content {
            text-align: center;
            z-index: 1;
            animation: fadeInUp 1.5s ease forwards;
            opacity: 0;
            transform: translateY(50px);
        }
        
        .hero h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #BCA4E3;
            text-shadow: 0 2px 10px rgba(188, 164, 227, 0.2);
        }
        
        .hero p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #555;
        }
        
        /* Falling items animation */
        .falling-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .falling-item {
            position: absolute;
            width: 20px;
            height: 20px;
            font-size: 20px;
            opacity: 0.8;
            animation: item-fall 8s linear infinite;
        }
        
        .strawberry { color: #ff4444; }
        .sushi { color: #ff7f50; }
        .boba { color: #8b4513; }
        .flower { color: #ff69b4; }

        /* Bouncing Animation Section */
        .bouncing-section {
            height: 100vh;
            background-color: #f9f7f7;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .bouncing-image {
            position: absolute;
            width: 150px;
            height: auto;
            max-width: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: filter 0.1s ease;
        }
        
        .bouncing-image.corner-hit {
            filter: hue-rotate(60deg) saturate(150%) brightness(120%);
        }
        
        /* Corner hit effect */
        @keyframes corner-flash {
            0% { 
                filter: hue-rotate(0deg) saturate(150%) brightness(150%);
                box-shadow: 0 4px 25px rgba(188, 164, 227, 0.8);
                transform: scale(1.1);
            }
            100% { 
                filter: hue-rotate(360deg) saturate(100%) brightness(100%);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                transform: scale(1);
            }
        }
        
        .corner-hit {
            animation: corner-flash 0.5s ease-out;
        }
        
        /* Footer */
        footer {
            padding: 50px 0;
            background-color: #333;
            color: white;
            text-align: center;
            min-height: 120px;
        }
        
        footer p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(50px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes item-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        /* Mobile and iOS Styles */
        @media (max-width: 768px) {
            body {
                padding-bottom: 0;
                margin-bottom: 0;
            }

            html {
                height: 100%;
            }

            .hero {
                height: 100vh;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
                
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                -webkit-overflow-scrolling: touch;
                position: relative;
            }

            .hero-content {
                transform: none;
                margin: 0;
                padding: 0;
                position: relative;
                z-index: 1;
            }
            
            .hero h1 {
                font-size: 2.5rem;
                line-height: 1.2;
            }
            
            .hero p {
                font-size: 1.1rem;
                margin-bottom: 20px;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .bouncing-image {
                width: 120px;
                max-width: 150px;
            }
            
            .falling-item {
                font-size: 16px;
                width: 16px;
                height: 16px;
            }

            footer {
                padding: 50px 0 0 0;
                margin: 0;
                background-color: #333;
            }

            footer::after {
                content: '';
                display: block;
                height: env(safe-area-inset-bottom, 20px);
                background-color: #333;
            }
        }
        
        /* Small Mobile Styles */
        @media (max-width: 480px) {
            .hero {
                height: 100vh;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
                padding: 15px;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero p {
                font-size: 1rem;
            }
            
            .bouncing-image {
                width: 100px;
                max-width: 120px;
            }
        }
        
        /* iOS Safari specific optimizations */
        @supports (-webkit-appearance: none) and (stroke-color: transparent) {
            .hero {
                height: 100vh;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
                
                -webkit-transform: translateZ(0);
                transform: translateZ(0);
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
                position: relative;
                overflow: hidden;
            }
            
            .hero-content {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: none;
                padding: 0;
                margin: 0;
                
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }

            body {
                padding-bottom: 0;
                -webkit-overflow-scrolling: touch;
            }

            footer {
                padding-bottom: env(safe-area-inset-bottom, 0);
            }
        }
        
        /* Additional iOS 15+ Safari fixes */
        @media screen and (max-width: 768px) {
            @supports (height: 100dvh) {
                .hero {
                    height: 100dvh;
                    min-height: 100dvh;
                }
                
                .bouncing-section {
                    height: 100dvh;
                }
            }
            
            @supports (height: 100svh) {
                .hero {
                    height: 100svh;
                    min-height: 100svh;
                }
                
                .bouncing-section {
                    height: 100svh;
                }
            }
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="falling-container" id="falling-items"></div>
        <div class="hero-content container">
            <h1>Happy Anniversary!</h1>
            <p>To my amazing girlfriend</p>
        </div>
    </section>

    <!-- Bouncing Animation Section -->
    <section class="bouncing-section" id="bouncing">
        <img src="pics/twincross.jpg" alt="Our Special Memory" class="bouncing-image" id="bouncingImage">
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Made with ❤️ by John</p>
        </div>
    </footer>

    <script>
        // Create falling items with seamless animation
        const fallingContainer = document.getElementById('falling-items');
        const items = ['🍓', '🍣', '🧋', '🌸'];
        const itemClasses = ['strawberry', 'sushi', 'boba', 'flower'];
        
        for (let i = 0; i < 50; i++) {
            const item = document.createElement('div');
            const randomIndex = Math.floor(Math.random() * items.length);
            item.classList.add('falling-item', itemClasses[randomIndex]);
            item.textContent = items[randomIndex];
            item.style.left = Math.random() * 100 + '%';
            item.style.animationDelay = '-' + (Math.random() * 8) + 's';
            item.style.animationDuration = Math.random() * 4 + 6 + 's';
            fallingContainer.appendChild(item);
        }

        // DVD Bouncing Animation
        class DVDBouncer {
            constructor(imageElement) {
                this.image = imageElement;
                this.container = imageElement.parentElement;
                this.x = Math.random() * (this.container.clientWidth - 150);
                this.y = Math.random() * (this.container.clientHeight - 150);
                this.dx = 2 + Math.random() * 3; // Random speed between 2-5
                this.dy = 2 + Math.random() * 3;
                this.cornerHits = 0;
                
                this.image.style.left = this.x + 'px';
                this.image.style.top = this.y + 'px';
                
                this.animate();
            }
            
            animate() {
                this.x += this.dx;
                this.y += this.dy;
                
                const imageRect = this.image.getBoundingClientRect();
                const containerRect = this.container.getBoundingClientRect();
                const imageWidth = imageRect.width;
                const imageHeight = imageRect.height;
                const containerWidth = containerRect.width;
                const containerHeight = containerRect.height;
                
                let hitCorner = false;
                
                // Check for collisions and bounce
                if (this.x + imageWidth >= containerWidth || this.x <= 0) {
                    this.dx = -this.dx;
                    this.x = Math.max(0, Math.min(this.x, containerWidth - imageWidth));
                    
                    // Check if it's a corner hit
                    if ((this.y <= 5 || this.y + imageHeight >= containerHeight - 5)) {
                        hitCorner = true;
                    }
                }
                
                if (this.y + imageHeight >= containerHeight || this.y <= 0) {
                    this.dy = -this.dy;
                    this.y = Math.max(0, Math.min(this.y, containerHeight - imageHeight));
                    
                    // Check if it's a corner hit
                    if ((this.x <= 5 || this.x + imageWidth >= containerWidth - 5)) {
                        hitCorner = true;
                    }
                }
                
                // Corner hit effect
                if (hitCorner) {
                    this.cornerHits++;
                    this.image.classList.add('corner-hit');
                    setTimeout(() => {
                        this.image.classList.remove('corner-hit');
                    }, 500);
                    
                    // Change speed slightly on corner hit for variety
                    this.dx += (Math.random() - 0.5) * 0.5;
                    this.dy += (Math.random() - 0.5) * 0.5;
                    
                    // Keep speed within reasonable bounds
                    this.dx = Math.max(1.5, Math.min(Math.abs(this.dx), 4)) * Math.sign(this.dx);
                    this.dy = Math.max(1.5, Math.min(Math.abs(this.dy), 4)) * Math.sign(this.dy);
                }
                
                // Update position
                this.image.style.left = this.x + 'px';
                this.image.style.top = this.y + 'px';
                
                // Continue animation
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize bouncing animation when page loads
        let bouncer;
        
        function initializeBouncer() {
            const bouncingImage = document.getElementById('bouncingImage');
            if (bouncingImage && bouncingImage.complete) {
                bouncer = new DVDBouncer(bouncingImage);
            } else if (bouncingImage) {
                bouncingImage.onload = () => {
                    bouncer = new DVDBouncer(bouncingImage);
                };
            }
        }
        
        // Handle window resize
        function handleResize() {
            if (bouncer) {
                const containerRect = bouncer.container.getBoundingClientRect();
                const imageRect = bouncer.image.getBoundingClientRect();
                
                // Keep image within bounds after resize
                bouncer.x = Math.max(0, Math.min(bouncer.x, containerRect.width - imageRect.width));
                bouncer.y = Math.max(0, Math.min(bouncer.y, containerRect.height - imageRect.height));
            }
        }
        
        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
        
        // iOS Safari viewport height fix
        function setViewportHeight() {
            if (window.innerWidth <= 768) {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
        }
        
        // Initialize on page load
        window.addEventListener('load', function() {
            initializeBouncer();
            setViewportHeight();
        });
        
        // Handle resize and orientation change
        window.addEventListener('resize', function() {
            handleResize();
            setViewportHeight();
        });
        
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                handleResize();
                setViewportHeight();
            }, 100);
        });
    </script>
</body>
</html>
